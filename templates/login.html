<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf }}"><title>CardioAgent｜工作站登入</title><link rel="stylesheet" href="/static/hospital.css"><script defer src="/static/login.js"></script></head><body class="login-page"><main class="login-card"><div class="hospital-logo"><strong>影像會診準備工作站</strong></div><p class="login-caption">CardioAgent 2.0 / 本機影像分析環境</p><h1>{% if setup %}建立本機管理者{% else %}工作站登入{% endif %}</h1><form id="loginForm" data-setup="{{ 'true' if setup else 'false' }}"><label>帳號<input id="username" autocomplete="username" minlength="3" maxlength="40" required autofocus></label><label>密碼<input id="password" type="password" autocomplete="{{ 'new-password' if setup else 'current-password' }}" minlength="{{ 12 if setup else 1 }}" maxlength="128" required></label>{% if setup %}<p class="field-help">首次設定沒有預設密碼。請使用至少 12 字元；管理者可在工作站中建立其他角色。</p>{% endif %}<button class="primary wide" type="submit">{% if setup %}建立帳號並登入{% else %}登入工作站{% endif %}</button><p id="loginError" class="error" role="alert"></p></form><div class="login-note">本機帳號不連接醫院身分系統。本版供研究、流程展示與介接準備；影像與報告需由授權人員核對。</div></main></body></html>
